<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MypageContact</title>
    <link rel="stylesheet" href="./styles/main-page.css">
</head>
<body>
    <header class="header">
        <h2 class="header-title">Contact me!</h2>
    </header>
     <nav class="main-menu">
        <div class="menu-item">Home</div>
        <div class="menu-item">About</div>
        <div class="menu-item">Service</div>
        <div class="menu-item">Contact</div>
    </nav>
    <main class="main">
      <form class="contact-form" action="mailto: someone@gmail.com" method="post" enctype="text/plain">
        <fieldset>
        <legend class="legend">Personal Information</legend>
        <div>
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first-name"
            placeholder="enter your first name...">
        </div>
        <div>
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last-name" placeholder="enter your last name...">
        </div>
        </fieldset>

        <fieldset>
            <legend class="legend">Message & Email</legend>
            <div>
             <textarea id="message" name="message" placeholder="Message..."></textarea>
            </div>
            <div>
             <label for="email">Email</label>
             <input type="text" id="email" placeholder="enter your email...">
            </div>
        </fieldset>
        <button class="button" type="submit">Submit</button>
      </form>
    
</body>
</html>
